<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Benjamin Gardner">
    <title>Recipe Book</title>
    <link rel="stylesheet" href="styles.css">
    <script src="recipes.js" defer></script>

    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Recipe Book">
    <meta property="og:description" content="an incredibly awesome recipe book">
    <meta property="og:url" content="https://berlga-2006.github.io/wdd131/recipes/">
    <meta property="og:image" content="images/apple-crisp.jpg">

    <!-- X Card -->
    <meta name="twitter:card" content="Social Preview Image">
    <meta name="twitter:title" content="Recipe Book">
    <meta name="twitter:description" content="an incredibly awesome recipe book">
    <meta name="twitter:image" content="images/apple-crisp.jpg">

    <!-- One favicon (ICO works everywhere) -->
    <link rel="icon" href="favicon.ico">

    <!-- One Apple Touch Icon (iOS home screen) -->
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">

</head>

<body>
    <header>
        <div class="headerContainer">
            <img src="images/recipe-book.png" alt="Recipe Book Logo">
            <h1 class="amatic-sc-bold">RecipeBook</h1>
        </div>
    </header>

    <main>
        <div class="searchBar">
            <input type="search" placeholder="Find a recipe...">
            <img src="images/search.svg" alt="Magnifying Glass">
        </div>
        <hr>
        <section class="recipe">
            <img src="images/apple-crisp.jpg" alt="Apple Crisp Dessert">
            <div class="recipeInfo">
                <button>dessert</button>
                <h2 class="amatic-sc-bold">Apple Crisp</h2>

                <span class="rating" role="img" aria-label="Rating: 4 out of 5 stars">
                    <span aria-hidden="true" class="icon-star">⭐</span>
                    <span aria-hidden="true" class="icon-star">⭐</span>
                    <span aria-hidden="true" class="icon-star">⭐</span>
                    <span aria-hidden="true" class="icon-star">⭐</span>
                    <span aria-hidden="true" class="icon-star-empty">☆</span>
                </span>

                <p class="recipeDescription" hidden>This apple crisp recipe is a simple yet delicious fall dessert
                    that's great serverd warm with vanilla ice cream.</p>

            </div>
        </section>

    </main>

    <footer>
        <div class="social">
            <!-- Social media icons provided under CC from https://www.iconfinder.com/AlfredoCreates  -->
            <a href="#"><img src="images/instagram_icon.svg" alt="instagram icon"></a>
            <a href="#"><img src="images/youtube_icon.svg" alt="youtube icon"></a>
            <a href="#"><img src="images/pinterest_icon.svg" alt="pinterest icon"></a>
        </div>
        <a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">Recipe icons created by Freepik -
            Flaticon</a>
    </footer>
</body>

</html>
