<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms Playground</title>
</head>
<body>
    <main>
        <h1>This is a form!</h1>
        <form>
            <label for="ssn">Enter your social security number please and thank you</label>
            <input type="text" id="ssn" placeholder="111-11-1111" name="ssn" required maxlength="9" minlength="9">
            <input type="search" name="search">
            <input type="password" name="password">
            <input type="color" name="favoriteColor">

            <input type="submit" value="submit">

        </form>
    </main>
</body>
</html>
