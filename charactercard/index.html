<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Card</title>
    <link rel="stylesheet" href="styles.css">
    <script src="charactercard.js" defer></script>
    <link rel="icon" href="favicon.ico">
    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Put Page Title Here">
    <meta property="og:description" content="Put Page Description Here">
    <meta property="og:url" content="https://yourURLofPage.here">
    <meta property="og:image" content="snortleblat.webp">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Character Card">
    <meta name="twitter:description" content="a super epic interactable character card">
    <meta name="twitter:image" content="snortleblat.webp">

    <!-- One favicon (ICO works everywhere) -->
    <link rel="icon" href="favicon.ico">

    <!-- One Apple Touch Icon (iOS home screen) -->
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
</head>
<body>
    <section id="card">
        <img class="cardImage" src="snortleblat.webp">
        <h2>Snortleblat</h2>
        <div class="cardBottom">
            <div class="cardInfo">

            </div>
            <div class="buttons">
                <button class="attackedButton">
                    Attacked
                </button>

                <button class="levelUpButton">
                    Level Up
                </button>
            </div>
        </div>
    </section>
</body>
</html>
