<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Ticket</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="favicon.ico">
    <script src="eventform.js" defer></script>
</head>
<body>
    <main class="wrapper">
        <h1>Event Ticket</h1>
        <form>
            <div class="field">
                <label for="firstName">First Name</Label>
                <input id="firstName" name="firstName" type="text" required>
            </div>

            <div class="field">
                <label for="lastname">Last Name</label>
                <input id="lastName" name="lastName" type="text" required>
            </div>

            <div class="field full">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" required>
            </div>

            <div class="field">
                <label for="type">Type</label>
                <select id="type" name="type" aria-controls="codeContainer" required>
                    <option value="">Choose one</option>
                    <option value="student">Student</option>
                    <option value="guest">Guest</option>
                </select>
            </div>

            <div class="field">
                <label for="date">Date</label>
                <input id="date" name="date" type="date" required>
            </div>

            <div id="codeContainer" class="field full" hidden>
                <label for="code"></label>
                <input id="code" name="code" type="text" required>
            </div>

            <button type="submit" class="full">Create Ticket</button>
        </form>
        <section id="output" aria-live="polite"></section>
    </main>
</body>
</html>
